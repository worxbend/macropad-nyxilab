[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyxd"
version = "1.0.0"
description = "Host bridge for the Nyxilab macropad: CPU, memory and more on its HOST layer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []  # standard library only; Python < 3.11 needs `tomli` to read a config file

[project.scripts]
nyxd = "nyxd.cli:nyxd"
nyxctl = "nyxd.cli:nyxctl"

[tool.setuptools]
packages = ["nyxd"]
