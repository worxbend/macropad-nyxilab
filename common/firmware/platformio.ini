; Shared firmware libraries of the Nyxilab macropad (lib/nyx_*), used by
; joystick/firmware and rotary/firmware.  This project only runs their host tests:
;
;   pio test -e native      unit tests of lib/nyx_core (engine, layers, tap-hold, macros, knob bindings, LEDs)

[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
