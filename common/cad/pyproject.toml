[project]
name = "macropad-cad"
version = "1.0.0"
description = "Shared parametric 3D-printable case of the Nyxilab macropad (build123d); the editions add the centre control"
requires-python = ">=3.10"
dependencies = [
    "build123d>=0.9",
    "manifold3d>=2.5",
    "trimesh>=4.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "networkx",
    "rtree",
]

[project.optional-dependencies]
render = ["moderngl>=5.10", "glcontext", "pillow"]

[tool.setuptools]
packages = ["macropad_cad"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
