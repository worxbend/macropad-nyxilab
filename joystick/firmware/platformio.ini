; Nyxilab macropad firmware - JOYSTICK edition (KY-023 thumbstick)
;
;   pio run                 build for Pico 2 (RP2350)
;   pio run -t upload       flash (hold BOOTSEL / use the BOOT key the first time)
;   pio run -e pico         build for the original Pico (RP2040)
;   pio test -e native      run the unit tests of the joystick maths on the PC
;
; The shared code (engine, USB, displays, LEDs, app loop) is in ../../common/firmware/lib.

[platformio]
default_envs = pico2

[env]
; pinned: this platform commit also pins the Arduino-Pico core (6.1.0+, fd65f6d) and the
; toolchain, so every build uses the same code.  To update: change the hash, rebuild, test on hardware.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64k
lib_extra_dirs = ../../common/firmware/lib
build_flags =
    -DUSE_TINYUSB
    -O2
    -Wall
    -I${PROJECT_DIR}/include   ; config.h is used by the shared libraries too
build_src_flags =
    -Wextra
    -Wno-missing-field-initializers
lib_deps =   ; exact versions of everything compiled (ST7735's seesaw / SD dependencies are never built)
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
    adafruit/Adafruit NeoPixel@1.15.5
    adafruit/Adafruit BusIO@1.17.4
monitor_speed = 115200

[env:pico2]
board = rpipico2

[env:pico]
board = rpipico

; host-side unit tests of src/joystick.cpp (no hardware needed)
[env:native]
platform = native
framework =
lib_extra_dirs =   ; the shared libraries are not built for the host tests
build_flags = -std=gnu++17 -Wall -Wextra -I${PROJECT_DIR}/../../common/firmware/lib/nyx_core/src
build_src_filter = -<*> +<joystick.cpp>
test_build_src = yes
lib_deps =
