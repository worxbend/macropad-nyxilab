; Nyxilab macropad firmware
;
;   pio run                 build for Pico 2 (RP2350)
;   pio run -t upload       flash (hold BOOTSEL / use the BOOT key the first time)
;   pio run -e pico         build for the original Pico (RP2040)
;   pio test -e native      run the unit tests of the key/joystick logic on the PC

[platformio]
default_envs = pico2

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 64k
build_flags =
    -DUSE_TINYUSB
    -O2
    -Wall
build_src_flags =
    -Wextra
    -Wno-missing-field-initializers
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
monitor_speed = 115200

[env:pico2]
board = rpipico2

[env:pico]
board = rpipico

; host-side unit tests of src/core (no hardware needed)
[env:native]
platform = native
framework =
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*> +<core/> -<core/keymap.cpp>
test_build_src = yes
lib_deps =
